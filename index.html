<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8-1 Kate - Tactical ITA2/MFSK Terminal</title>
    <style>
        :root {
            --bg-color: #0b0f12;
            --panel-bg: #13181d;
            --accent-green: #00ff66;
            --accent-dim: #00441a;
            --text-main: #c0d0c0;
            --border-color: #1f2e22;
            --warning-amber: #ffaa00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel-bg); border-bottom: 2px solid var(--border-color); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; color: var(--accent-green); letter-spacing: 2px; text-transform: uppercase; }
        .status-badge { font-size: 0.8rem; padding: 2px 8px; border: 1px solid var(--border-color); background: #000; }
        .active { color: var(--accent-green); border-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-dim); }
        .main-container { display: grid; grid-template-columns: 1fr 340px; flex: 1; gap: 8px; padding: 8px; overflow: hidden; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 8px; border-radius: 4px; overflow: hidden; }
        .panel-title { font-size: 0.85rem; font-weight: bold; color: var(--warning-amber); margin-bottom: 6px; text-transform: uppercase; border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; flex-shrink: 0; }
        
        /* Main Traffic Log (Left Column) */
        #traffic-log { 
            flex: 1; 
            background: #050708; 
            border: 1px solid var(--border-color); 
            padding: 8px; 
            overflow-y: auto; 
            font-size: 0.85rem; 
            line-height: 1.3; 
            white-space: pre-wrap; 
            word-break: break-all; 
            margin-bottom: 8px;
        }

        /* Sub-Frame Info Log (Right Column) - Strictly limited height */
        #info-log { 
            height: 120px; 
            max-height: 120px; 
            flex: none; 
            background: #050708; 
            border: 1px solid var(--border-color); 
            padding: 6px; 
            overflow-y: auto; 
            font-size: 0.75rem; 
            line-height: 1.2; 
            white-space: pre-wrap; 
            word-break: break-all; 
            margin-top: 4px;
            color: #88aa88;
        }

        .input-row { display: flex; gap: 8px; flex-shrink: 0; }
        input[type="text"] { flex: 1; background: #050708; border: 1px solid var(--border-color); color: var(--accent-green); padding: 8px; font-size: 0.9rem; text-transform: uppercase; }
        button { background: #1a261c; border: 1px solid var(--accent-green); color: var(--accent-green); padding: 8px 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        button:active { background: var(--accent-green); color: #000; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; flex-shrink: 0; }
        .metric-box { background: #050708; border: 1px solid var(--border-color); padding: 6px; text-align: center; }
        .metric-value { font-size: 1rem; color: var(--accent-green); font-weight: bold; }
        .metric-label { font-size: 0.7rem; color: #668866; }
        #waterfall { width: 100%; height: 100px; background: #000; border: 1px solid var(--border-color); margin-top: 4px; flex-shrink: 0; }
    </style>
</head>
<body>

<header>
    <h1>K8-1 Kate // Tactical ITA2 Terminal [LBT + Baudot]</h1>
    <div id="connection-status" class="status-badge">AUDIO OFFLINE</div>
</header>

<div class="main-container">
    <!-- Left Column: Message Traffic Log & Input -->
    <div class="panel">
        <div class="panel-title">Tactical Message Traffic (ITA2)</div>
        <div id="traffic-log">[SYS] Terminal initialized. ITA2 5-bit codec active.</div>
        <div class="input-row">
            <input type="text" id="tx-input" placeholder="Enter tactical message..." autocomplete="off">
            <button onclick="transmitMessage()">Transmit</button>
        </div>
    </div>

    <!-- Right Column: Telemetry, Spectrum, and Sub-Frame Info Log -->
    <div class="panel">
        <div class="panel-title">Link Telemetry</div>
        <div class="controls-grid">
            <div class="metric-box">
                <div id="m-baud" class="metric-value">6.6</div>
                <div class="metric-label">Baud Rate</div>
            </div>
            <div class="metric-box">
                <div id="m-mode" class="metric-value">ITA2</div>
                <div class="metric-label">Codec</div>
            </div>
        </div>
        <button onclick="initAudio()" style="width: 100%; margin-bottom: 4px; flex-shrink: 0;">Init Audio Engine</button>
        <div class="panel-title" style="margin-top: 2px;">Spectrum Monitor</div>
        <canvas id="waterfall"></canvas>

        <!-- Sub-Frame Info Log with strict height limit -->
        <div class="panel-title" style="margin-top: 6px;">System Info & Squelch</div>
        <div id="info-log">[SYS] Standby for link activity...</div>
    </div>
</div>

<script>
    const BASE_FREQ = 400;
    const CHANNEL_WIDTH = 300;
    const NUM_CHANNELS = 8;
    const SYMBOL_DURATION = 0.15;
    const RAMP_TIME = 0.015;

    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let isListening = false;

    let isReceiving = false;
    let symbolBuffer = [];
    let silenceFrames = 0;
    const SILENCE_THRESHOLD_FRAMES = 15;
    const SQUELCH_ENERGY_LIMIT = 110;

    let channelLastHeard = new Array(NUM_CHANNELS).fill(0);
    let currentWorkingChannel = 0;

    // --- ITA2 (BAUDOT) LOOKUP TABLES ---
    const ITA2_LTRS = {
        0: '\0', 1: 'E', 2: '\n', 3: 'A', 4: ' ', 5: 'S', 6: 'I', 7: 'U',
        8: '\r', 9: 'D', 10: 'R', 11: 'J', 12: 'N', 13: 'F', 14: 'C', 15: 'K',
        16: 'T', 17: 'Z', 18: 'L', 19: 'W', 20: 'H', 21: 'Y', 22: 'P', 23: 'Q',
        24: 'O', 25: 'B', 26: 'G', 27: 'FIGS', 28: 'M', 29: 'X', 30: 'V', 31: 'LTRS'
    };

    const ITA2_FIGS = {
        0: '\0', 1: '3', 2: '\n', 3: '-', 4: ' ', 5: '\'', 6: '8', 7: '7',
        8: '\r', 9: '$', 10: '4', 11: '!', 12: ',', 13: '!', 14: ':', 15: '(',
        16: '5', 17: '"', 18: ')', 19: '2', 20: '#', 21: '6', 22: '0', 23: '1',
        24: '9', 25: '?', 26: '&', 27: 'FIGS', 28: '.', 29: '/', 30: ';', 31: 'LTRS'
    };

    // Reverse lookup maps for encoding
    const LTRS_REV = {};
    const FIGS_REV = {};
    for (let k in ITA2_LTRS) if (ITA2_LTRS[k].length === 1) LTRS_REV[ITA2_LTRS[k]] = parseInt(k);
    for (let k in ITA2_FIGS) if (ITA2_FIGS[k].length === 1) FIGS_REV[ITA2_FIGS[k]] = parseInt(k);

    function logTraffic(txt) {
        const log = document.getElementById('traffic-log');
        log.textContent += "\n" + txt;
        log.scrollTop = log.scrollHeight;
    }

    function logInfo(txt) {
        const log = document.getElementById('info-log');
        log.textContent += "\n" + txt;
        log.scrollTop = log.scrollHeight;
    }

    // Encode string to array of 5-bit ITA2 codes (handling LTRS/FIGS shifts)
    function encodeITA2(str) {
        let codes = [];
        let currentMode = 'LTRS';

        str = str.toUpperCase();
        for (let i = 0; i < str.length; i++) {
            let char = str[i];
            if (LTRS_REV[char] !== undefined) {
                if (currentMode !== 'LTRS') {
                    codes.push(31); // LTRS shift code
                    currentMode = 'LTRS';
                }
                codes.push(LTRS_REV[char]);
            } else if (FIGS_REV[char] !== undefined) {
                if (currentMode !== 'FIGS') {
                    codes.push(27); // FIGS shift code
                    currentMode = 'FIGS';
                }
                codes.push(FIGS_REV[char]);
            }
        }
        return codes;
    }

    // Decode array of 5-bit ITA2 codes back to string
    function decodeITA2(codes) {
        let out = '';
        let mode = 'LTRS';

        for (let i = 0; i < codes.length; i++) {
            let code = codes[i];
            if (code === 27) { mode = 'FIGS'; continue; }
            if (code === 31) { mode = 'LTRS'; continue; }

            if (mode === 'LTRS') {
                out += (ITA2_LTRS[code] || '');
            } else {
                out += (ITA2_FIGS[code] || '');
            }
        }
        return out;
    }

    async function initAudio() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });
            
            const source = audioCtx.createMediaStreamSource(micStream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);

            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            document.getElementById('connection-status').textContent = 'AUDIO ACTIVE';
            document.getElementById('connection-status').classList.add('active');
            logInfo("[SYS] Audio active. ITA2 receiver engaged.");
            
            startReceiverLoop();
        } catch (err) {
            logInfo("[ERR] Audio init failed: " + err.message);
        }
    }

    function getNextClearChannel() {
        let now = Date.now();
        let attempts = 0;
        while (attempts < NUM_CHANNELS) {
            if (now - channelLastHeard[currentWorkingChannel] > 5000) {
                return currentWorkingChannel;
            }
            logInfo(`[LBT] Channel ${currentWorkingChannel} busy. Shifting...`);
            currentWorkingChannel = (currentWorkingChannel + 1) % NUM_CHANNELS;
            attempts++;
        }
        return currentWorkingChannel;
    }

    async function transmitMessage() {
        if (!audioCtx) {
            alert("Initialize audio engine first!");
            return;
        }
        const text = document.getElementById('tx-input').value;
        if (!text) return;
        document.getElementById('tx-input').value = '';

        let activeTxBaseChannel = getNextClearChannel();
        logInfo(`[TX] Base Channel: CH ${activeTxBaseChannel}`);
        logTraffic("[TX] " + text.toUpperCase());

        let ita2Codes = encodeITA2(text);
        let symbols = [];

        // Pack each 5-bit ITA2 code into two 3-bit MFSK symbols
        ita2Codes.forEach(code => {
            let sym1 = (code >> 2) & 0x07; // Upper 3 bits
            let sym2 = code & 0x03;        // Lower 2 bits
            symbols.push((sym1 + activeTxBaseChannel) % NUM_CHANNELS);
            symbols.push((sym2 + activeTxBaseChannel) % NUM_CHANNELS);
        });

        let startTime = audioCtx.currentTime + 0.1;
        symbols.forEach((sym, index) => {
            let freq = BASE_FREQ + (sym * CHANNEL_WIDTH) + (CHANNEL_WIDTH / 2);
            let t = startTime + (index * SYMBOL_DURATION);

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);

            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.7, t + RAMP_TIME);
            gain.gain.setValueAtTime(0.7, t + SYMBOL_DURATION - RAMP_TIME);
            gain.gain.linearRampToValueAtTime(0, t + SYMBOL_DURATION);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(t);
            osc.stop(t + SYMBOL_DURATION);
        });

        currentWorkingChannel = (currentWorkingChannel + 1) % NUM_CHANNELS;
    }

    function startReceiverLoop() {
        if (isListening) return;
        isListening = true;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const canvas = document.getElementById('waterfall');
        const canvasCtx = canvas.getContext('2d');

        function loop() {
            requestAnimationFrame(loop);
            analyser.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = '#000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            let barWidth = canvas.width / NUM_CHANNELS;
            
            let maxBinVal = 0;
            let dominantChannel = -1;

            for (let i = 0; i < NUM_CHANNELS; i++) {
                let targetFreq = BASE_FREQ + (i * CHANNEL_WIDTH) + (CHANNEL_WIDTH / 2);
                let binIndex = Math.round(targetFreq / (audioCtx.sampleRate / analyser.fftSize));
                let val = dataArray[binIndex] || 0;

                if (val > 80) channelLastHeard[i] = Date.now();

                if (val > maxBinVal) {
                    maxBinVal = val;
                    dominantChannel = i;
                }
                
                canvasCtx.fillStyle = val > 120 ? '#00ff66' : '#113311';
                canvasCtx.fillRect(i * barWidth, canvas.height - (val / 255) * canvas.height, barWidth - 2, (val / 255) * canvas.height);
            }

            if (!isReceiving) {
                if (maxBinVal > SQUELCH_ENERGY_LIMIT) {
                    isReceiving = true;
                    symbolBuffer = [];
                    silenceFrames = 0;
                    logInfo("[RX] Squelch Open (CH " + dominantChannel + ")");
                }
            } else {
                if (maxBinVal > SQUELCH_ENERGY_LIMIT) {
                    silenceFrames = 0;
                    symbolBuffer.push(dominantChannel);
                } else {
                    silenceFrames++;
                    if (silenceFrames > SILENCE_THRESHOLD_FRAMES) {
                        isReceiving = false;
                        logInfo("[RX] Squelch Closed.");
                        processPacketBuffer(symbolBuffer);
                        symbolBuffer = [];
                    }
                }
            }
        }
        loop();
    }

    function processPacketBuffer(symbols) {
        if (symbols.length < 2 || symbols.length % 2 !== 0) {
            logInfo("[ERR] Invalid symbol count (" + symbols.length + ")");
            return;
        }

        logInfo("[RX] Parsing " + symbols.length + " symbols...");
        let baseCh = symbols[0];
        let unshift = (val, base) => (val - base + NUM_CHANNELS) % NUM_CHANNELS;

        let ita2Codes = [];
        for (let i = 0; i < symbols.length; i += 2) {
            let s1 = unshift(symbols[i], baseCh);
            let s2 = unshift(symbols[i+1], baseCh);
            let code = (s1 << 2) | s2;
            ita2Codes.push(code);
        }

        let decodedMessage = decodeITA2(ita2Codes);
        logTraffic("[RX] " + decodedMessage);
    }
</script>
</html>
