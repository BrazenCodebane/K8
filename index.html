<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K8-1 Kate - Tactical MFSK Terminal</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #131722;
            --border-color: #2a2e3d;
            --accent-green: #00ff66;
            --accent-blue: #00bfff;
            --accent-yellow: #ffcc00;
            --text-color: #d1d5db;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-mono);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { font-weight: bold; font-size: 1.1rem; color: var(--accent-green); }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }

        /* 8-Channel Matrix Grid */
        .channel-matrix {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .ch-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ch-header { display: flex; justify-content: space-between; }
        .ch-meter-bg { background: #1f2430; height: 6px; border-radius: 2px; overflow: hidden; }
        .ch-meter-fill { background: var(--accent-green); height: 100%; width: 0%; transition: width 0.1s; }

        /* Terminal Chat Log */
        .chat-log {
            flex: 1;
            background: #06080c;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .msg { margin-bottom: 6px; word-break: break-word; }
        .msg-rx { color: var(--accent-green); }
        .msg-tx { color: var(--accent-blue); }
        .msg-sys { color: var(--accent-yellow); }

        /* Controls */
        .control-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        select {
            background: #06080c;
            border: 1px solid var(--border-color);
            color: var(--accent-yellow);
            padding: 10px;
            font-family: var(--font-mono);
            border-radius: 4px;
        }

        input[type="text"] {
            flex: 1;
            background: #06080c;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            font-family: var(--font-mono);
            border-radius: 4px;
        }

        button {
            background: #1f2430;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 0 16px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-weight: bold;
            cursor: pointer;
        }

        button:active { background: var(--accent-green); color: #000; }
    </style>
</head>
<body>

    <header>
        <div class="brand">K8-1 "KATE" // MFSK ENCODER/DECODER (2x REPETITION)</div>
        <div id="status-tag" style="color: var(--accent-yellow); font-size: 0.8rem;">INIT REQUIRED</div>
    </header>

    <main>
        <!-- 8-Channel Matrix -->
        <div class="channel-matrix" id="matrix"></div>

        <!-- Terminal Chat Log -->
        <div class="chat-log" id="chatLog"></div>

        <!-- Transmit Panel -->
        <div class="control-panel">
            <select id="txDuration" title="Transmission Duration">
                <option value="1">1 sec</option>
                <option value="3">3 sec</option>
                <option value="5" selected>5 sec</option>
                <option value="10">10 sec</option>
                <option value="15">15 sec</option>
            </select>
            <input type="text" id="msgInput" placeholder="Initialize Audio to Start..." disabled>
            <button id="txBtn" onclick="handleTxOrInit()">INIT AUDIO</button>
        </div>
    </main>

    <script>
        const NUM_CHANNELS = 8;
        const BASE_FREQ = 400;
        const CHANNEL_WIDTH = 300;
        const SQUELCH_THRESHOLD = 30; 
        const SYMBOL_DURATION = 0.08; // 80ms per symbol slot
        const REPETITION_FACTOR = 2;   // Send each symbol 2x for redundancy
        
        let audioCtx = null;
        let analyser = null;
        let micStream = null;
        let isTransmitting = false;
        let isInitialized = false;

        // RX Decoder State
        let isReceiving = false;
        let rxRawSymbols = [];
        let lastCapturedSymbol = -1;
        let symbolCaptureTimer = 0;

        // Render Matrix UI
        const matrixEl = document.getElementById('matrix');
        for (let i = 0; i < NUM_CHANNELS; i++) {
            const centerFreq = BASE_FREQ + (i * CHANNEL_WIDTH) + (CHANNEL_WIDTH / 2);
            matrixEl.innerHTML += `
                <div class="ch-card" id="chCard-${i}">
                    <div class="ch-header">
                        <span>CH ${i}</span>
                        <span>${centerFreq}Hz</span>
                    </div>
                    <div class="ch-meter-bg">
                        <div class="ch-meter-fill" id="meter-${i}"></div>
                    </div>
                </div>
            `;
        }

        async function handleTxOrInit() {
            if (!isInitialized) {
                const ok = await initLiveAudio();
                if (ok) {
                    isInitialized = true;
                    document.getElementById('status-tag').innerText = "RX DECODER ACTIVE (2x FEC)";
                    document.getElementById('status-tag').style.color = "var(--accent-green)";
                    document.getElementById('msgInput').disabled = false;
                    document.getElementById('msgInput').placeholder = "Type message to encode & transmit...";
                    document.getElementById('txBtn').innerText = "TRANSMIT";
                }
                return;
            }

            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || isTransmitting) return;

            encodeAndTransmitMFSK(text);
            input.value = '';
        }

        async function initLiveAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
                    video: false
                });

                const micSource = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                micSource.connect(analyser);

                logMessage("sys", "Audio Engine online. MFSK decoder with symbol repetition active.");
                startDecoderPolling();
                return true;
            } catch (e) {
                logMessage("sys", `Audio Init Error: ${e.message}`);
                return false;
            }
        }

        // --- MFSK DECODER LOOP (WITH REPETITION COLLAPSING) ---
        function startDecoderPolling() {
            setInterval(() => {
                if (!analyser || isTransmitting) return;

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);

                const sampleRate = audioCtx.sampleRate;
                const binSize = (sampleRate / 2) / bufferLength;

                let strongestCh = -1;
                let maxEnergy = 0;

                for (let ch = 0; ch < NUM_CHANNELS; ch++) {
                    const chLow = BASE_FREQ + (ch * CHANNEL_WIDTH);
                    const chHigh = chLow + CHANNEL_WIDTH;

                    let totalEnergy = 0;
                    let count = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        const f = i * binSize;
                        if (f >= chLow && f < chHigh) {
                            totalEnergy += dataArray[i];
                            count++;
                        }
                    }

                    const avg = totalEnergy / (count || 1);
                    const meterFill = document.getElementById(`meter-${ch}`);
                    if (meterFill) {
                        meterFill.style.width = `${Math.min((avg / 128) * 100, 100)}%`;
                    }

                    if (avg > maxEnergy) {
                        maxEnergy = avg;
                        strongestCh = (avg >= SQUELCH_THRESHOLD) ? ch : -1;
                    }
                }

                const now = Date.now();

                if (strongestCh !== -1) {
                    if (!isReceiving) {
                        isReceiving = true;
                        rxRawSymbols = [];
                        logMessage("sys", `[RX] Squelch Open. Signal detected on Sub-CH ${strongestCh}. Decoding...`);
                    }

                    if (strongestCh !== lastCapturedSymbol || (now - symbolCaptureTimer) >= SYMBOL_DURATION * 1000) {
                        rxRawSymbols.push(strongestCh);
                        lastCapturedSymbol = strongestCh;
                        symbolCaptureTimer = now;
                    }
                } else {
                    if (isReceiving) {
                        isReceiving = false;
                        lastCapturedSymbol = -1;

                        // Step 1: Collapse 2x symbol repetitions into single symbols
                        let collapsedSymbols = [];
                        for (let i = 0; i < rxRawSymbols.length; i += REPETITION_FACTOR) {
                            // Take the first of the repeated block (or implement majority voting)
                            collapsedSymbols.push(rxRawSymbols[i]);
                        }

                        // Step 2: Reconstruct ASCII characters from 3-bit symbol pairs
                        let decodedMessage = "";
                        for (let i = 0; i < collapsedSymbols.length - 1; i += 2) {
                            let highBits = collapsedSymbols[i];
                            let lowBits = collapsedSymbols[i + 1];
                            let charCode = (highBits << 3) | lowBits;
                            
                            if (charCode >= 32 && charCode <= 126) {
                                decodedMessage += String.fromCharCode(charCode);
                            }
                        }

                        if (decodedMessage.length > 0) {
                            logMessage("rx", `[RX DECODED] ${decodedMessage}`);
                        } else {
                            logMessage("sys", `[RX] Squelch Closed (Packet too short or corrupted).`);
                        }

                        rxRawSymbols = [];
                    }
                }
            }, 30);
        }

        // --- MFSK ENCODER LOOP (WITH 2X REPETITION) ---
        function encodeAndTransmitMFSK(text) {
            if (isTransmitting) return;
            isTransmitting = true;

            const durationSelect = document.getElementById('txDuration');
            const maxTxDuration = parseInt(durationSelect.value) || 5;
            
            logMessage("tx", `[MFSK TX] Encoding "${text}" (2x Repetition, ${maxTxDuration}s window)`);

            const now = audioCtx.currentTime;

            // Convert text into 3-bit symbols
            let baseSymbols = [];
            for (let i = 0; i < text.length; i++) {
                let charCode = text.charCodeAt(i);
                baseSymbols.push((charCode >> 3) & 0x07);
                baseSymbols.push(charCode & 0x07);
            }

            // Apply 2x Symbol Repetition
            let repeatedSymbols = [];
            baseSymbols.forEach(sym => {
                for (let r = 0; r < REPETITION_FACTOR; r++) {
                    repeatedSymbols.push(sym);
                }
            });

            let cursorTime = now;

            // Open Preamble tone (200ms on first symbol)
            const primaryCh = repeatedSymbols[0] || 0;
            const preambleFreq = BASE_FREQ + (primaryCh * CHANNEL_WIDTH) + (CHANNEL_WIDTH / 2);
            playTone(preambleFreq, cursorTime, 0.2, 0.6);
            cursorTime += 0.2;

            // Timed Tone Shift Loop
            repeatedSymbols.forEach((sym) => {
                if ((cursorTime - now) >= maxTxDuration) return;

                const toneFreq = BASE_FREQ + (sym * CHANNEL_WIDTH) + (CHANNEL_WIDTH / 2);
                playTone(toneFreq, cursorTime, SYMBOL_DURATION, 0.5);
                cursorTime += SYMBOL_DURATION;
            });

            setTimeout(() => {
                logMessage("sys", `[TX] Transmission complete. Carrier dropped (Squelch Close).`);
                isTransmitting = false;
            }, (maxTxDuration + 0.3) * 1000);
        }

        function playTone(freq, startTime, duration, volume) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            
            gain.gain.setValueAtTime(volume, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function logMessage(type, text) {
            const log = document.getElementById('chatLog');
            const div = document.createElement('div');
            div.className = `msg msg-${type}`;
            div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleTxOrInit();
        });
    </script>
</body>
</html>
