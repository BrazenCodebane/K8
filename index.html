<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8-1 Kate - Dual-Carrier MFSK Terminal [Configurable Callsign]</title>
    <style>
        :root {
            --bg-color: #0b0f12;
            --panel-bg: #13181d;
            --log-bg: #050708;
            --accent-green: #00ff66;
            --accent-dim: #00441a;
            --text-main: #c0d0c0;
            --border-color: #1f2e22;
            --warning-amber: #ffaa00;
            --btn-bg: #1a261c;
            --info-text: #88aa88;
        }

        [data-theme="light"] {
            --bg-color: #e4e8e4;
            --panel-bg: #d2dad2;
            --log-bg: #f5f8f5;
            --accent-green: #007a33;
            --accent-dim: #99d6b0;
            --text-main: #112211;
            --border-color: #88a088;
            --warning-amber: #b36b00;
            --btn-bg: #c0d0c0;
            --info-text: #225522;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background-color 0.2s, color 0.2s; }
        header { background: var(--panel-bg); border-bottom: 2px solid var(--border-color); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; color: var(--accent-green); letter-spacing: 2px; text-transform: uppercase; }
        
        .header-controls { display: flex; align-items: center; gap: 8px; }
        .theme-toggle-btn, .settings-btn { background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 2px 8px; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .theme-toggle-btn:hover, .settings-btn:hover { border-color: var(--accent-green); }

        .status-badge { font-size: 0.8rem; padding: 2px 8px; border: 1px solid var(--border-color); background: var(--log-bg); }
        .active { color: var(--accent-green); border-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-dim); }
        
        .main-container { display: grid; grid-template-columns: 1fr 340px; flex: 1; gap: 8px; padding: 8px; overflow: hidden; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 8px; border-radius: 4px; overflow: hidden; }
        .panel-title { font-size: 0.85rem; font-weight: bold; color: var(--warning-amber); margin-bottom: 6px; text-transform: uppercase; border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; flex-shrink: 0; }
        
        #traffic-log { 
            flex: 1; 
            background: var(--log-bg); 
            border: 1px solid var(--border-color); 
            padding: 8px; 
            overflow-y: auto; 
            font-size: 0.85rem; 
            line-height: 1.3; 
            white-space: pre-wrap; 
            word-break: break-all; 
            margin-bottom: 8px;
            color: var(--text-main);
        }

        #info-log { 
            height: 120px; 
            max-height: 120px; 
            flex: none; 
            background: var(--log-bg); 
            border: 1px solid var(--border-color); 
            padding: 6px; 
            overflow-y: auto; 
            font-size: 0.75rem; 
            line-height: 1.2; 
            white-space: pre-wrap; 
            word-break: break-all; 
            margin-top: 4px;
            color: var(--info-text);
        }

        .input-row { display: flex; gap: 8px; flex-shrink: 0; }
        input[type="text"] { flex: 1; background: var(--log-bg); border: 1px solid var(--border-color); color: var(--accent-green); padding: 8px; font-size: 0.9rem; text-transform: uppercase; }
        button { background: var(--btn-bg); border: 1px solid var(--accent-green); color: var(--accent-green); padding: 8px 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        button:active { background: var(--accent-green); color: #000; }
        
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; flex-shrink: 0; }
        .metric-box { background: var(--log-bg); border: 1px solid var(--border-color); padding: 6px; text-align: center; }
        .metric-value { font-size: 1rem; color: var(--accent-green); font-weight: bold; }
        .metric-label { font-size: 0.7rem; color: var(--info-text); }
        #waterfall { width: 100%; height: 100px; background: var(--log-bg); border: 1px solid var(--border-color); margin-top: 4px; flex-shrink: 0; }

        /* Settings Modal Overlay */
        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel-bg); border: 2px solid var(--warning-amber); padding: 20px; width: 320px; border-radius: 4px; }
        .modal-title { font-size: 0.95rem; font-weight: bold; color: var(--warning-amber); margin-bottom: 12px; text-transform: uppercase; border-bottom: 1px dashed var(--border-color); padding-bottom: 6px; }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; font-size: 0.75rem; color: var(--info-text); margin-bottom: 4px; text-transform: uppercase; }
        .modal-field input { width: 100%; background: var(--log-bg); border: 1px solid var(--border-color); color: var(--accent-green); padding: 6px; font-size: 0.9rem; text-transform: uppercase; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    </style>
</head>
<body>

<header>
    <h1 id="header-title">K8-1 Kate // Tactical Terminal</h1>
    <div class="header-controls">
        <button class="settings-btn" onclick="openSettings()">[ ⚙ CONFIG ]</button>
        <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">[ ☀ LIGHT ]</button>
        <div id="connection-status" class="status-badge">AUDIO OFFLINE</div>
    </div>
</header>

<!-- Settings Modal -->
<div id="settings-modal">
    <div class="modal-content">
        <div class="modal-title">Terminal Station Config</div>
        <div class="modal-field">
            <label for="callsign-input">Operator Callsign</label>
            <input type="text" id="callsign-input" placeholder="e.g. KJ5NOV" autocomplete="off">
        </div>
        <div class="modal-actions">
            <button onclick="closeSettings()">Cancel</button>
            <button onclick="saveSettings()" style="background: var(--accent-green); color: #000;">Save</button>
        </div>
    </div>
</div>

<div class="main-container">
    <div class="panel">
        <div class="panel-title">Tactical Message Traffic (ITA2)</div>
        <div id="traffic-log">[SYS] Terminal ready. Callsign auto-injection active.</div>
        <div class="input-row">
            <input type="text" id="tx-input" placeholder="Enter tactical message..." autocomplete="off">
            <button onclick="transmitMessage()">Transmit</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">Link Telemetry</div>
        <div class="controls-grid">
            <div class="metric-box">
                <div id="m-baud" class="metric-value">10.0</div>
                <div class="metric-label">Baud Rate</div>
            </div>
            <div class="metric-box">
                <div id="m-mode" class="metric-value">2X-ITA2</div>
                <div class="metric-label">Codec</div>
            </div>
        </div>
        <button onclick="initAudio()" style="width: 100%; margin-bottom: 4px; flex-shrink: 0;">Init Audio Engine</button>
        <div class="panel-title" style="margin-top: 2px;">Spectrum Monitor</div>
        <canvas id="waterfall"></canvas>

        <div class="panel-title" style="margin-top: 6px;">System Info & Squelch</div>
        <div id="info-log">[SYS] Standby for link activity...</div>
    </div>
</div>

<script>
    // --- CALLSIGN CONFIGURATION MANAGEMENT ---
    let operatorCallsign = localStorage.getItem('k81_callsign') || 'KJ5NOV';

    function updateCallsignUI() {
        document.getElementById('header-title').textContent = `K8-1 Kate // ${operatorCallsign} Terminal`;
    }
    updateCallsignUI();

    function openSettings() {
        document.getElementById('callsign-input').value = operatorCallsign;
        document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettings() {
        document.getElementById('settings-modal').style.display = 'none';
    }

    function saveSettings() {
        const val = document.getElementById('callsign-input').value.trim().toUpperCase();
        if (val) {
            operatorCallsign = val;
            localStorage.setItem('k81_callsign', operatorCallsign);
            updateCallsignUI();
            logInfo(`[SYS] Callsign updated to: ${operatorCallsign}`);
        }
        closeSettings();
    }

    // --- THEME MANAGEMENT ---
    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(newTheme);
    }

    function applyTheme(theme) {
        if (theme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            document.getElementById('theme-toggle').textContent = '[ 🌙 DARK ]';
            localStorage.setItem('k81_theme', 'light');
        } else {
            document.body.removeAttribute('data-theme');
            document.getElementById('theme-toggle').textContent = '[ ☀ LIGHT ]';
            localStorage.setItem('k81_theme', 'dark');
        }
    }

    const savedTheme = localStorage.getItem('k81_theme');
    if (savedTheme === 'light') applyTheme('light');

    // --- ARCHITECTURE DEFINITIONS ---
    const TONE_SPACING = 50; 
    const SUBFREQ_BANDWIDTH = 500;
    const NUM_SUBFREQS = 4;
    const TONES_PER_SUBFREQ = 10;

    const SYMBOL_DURATION = 0.10; 
    const PTT_LEAD_IN_SILENCE = 1.0; 
    const SUBFREQ_SYNC_DURATION = 0.2;     
    const RAMP_TIME = 0.002;
    const OVERLOAD_GAIN = 0.98;

    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let isListening = false;

    let isReceiving = false;
    let symbolBuffer = [];
    let silenceFrames = 0;
    const SILENCE_THRESHOLD_FRAMES = 12;
    const SQUELCH_ENERGY_LIMIT = 100;

    let subfreqLastHeard = new Array(NUM_SUBFREQS).fill(0);
    let currentWorkingSubfreq = 0;

    // --- ITA2 LOOKUP TABLES ---
    const ITA2_LTRS = {
        0: '\0', 1: 'E', 2: '\n', 3: 'A', 4: ' ', 5: 'S', 6: 'I', 7: 'U',
        8: '\r', 9: 'D', 10: 'R', 11: 'J', 12: 'N', 13: 'F', 14: 'C', 15: 'K',
        16: 'T', 17: 'Z', 18: 'L', 19: 'W', 20: 'H', 21: 'Y', 22: 'P', 23: 'Q',
        24: 'O', 25: 'B', 26: 'G', 27: 'FIGS', 28: 'M', 29: 'X', 30: 'V', 31: 'LTRS'
    };

    const ITA2_FIGS = {
        0: '\0', 1: '3', 2: '\n', 3: '-', 4: ' ', 5: '\'', 6: '8', 7: '7',
        8: '\r', 9: '$', 10: '4', 11: '!', 12: ',', 13: '!', 14: ':', 15: '(',
        16: '5', 17: '"', 18: ')', 19: '2', 20: '#', 21: '6', 22: '0', 23: '1',
        24: '9', 25: '?', 26: '&', 27: 'FIGS', 28: '.', 29: '/', 30: ';', 31: 'LTRS'
    };

    const LTRS_REV = {};
    const FIGS_REV = {};
    for (let k in ITA2_LTRS) if (ITA2_LTRS[k].length === 1) LTRS_REV[ITA2_LTRS[k]] = parseInt(k);
    for (let k in ITA2_FIGS) if (ITA2_FIGS[k].length === 1) FIGS_REV[ITA2_FIGS[k]] = parseInt(k);

    function logTraffic(txt) {
        const log = document.getElementById('traffic-log');
        log.textContent += "\n" + txt;
        log.scrollTop = log.scrollHeight;
    }

    function logInfo(txt) {
        const log = document.getElementById('info-log');
        log.textContent += "\n" + txt;
        log.scrollTop = log.scrollHeight;
    }

    function encodeITA2(str) {
        let codes = [];
        let currentMode = 'LTRS';

        str = str.toUpperCase();
        for (let i = 0; i < str.length; i++) {
            let char = str[i];
            if (LTRS_REV[char] !== undefined) {
                if (currentMode !== 'LTRS') {
                    codes.push(31);
                    currentMode = 'LTRS';
                }
                codes.push(LTRS_REV[char]);
            } else if (FIGS_REV[char] !== undefined) {
                if (currentMode !== 'FIGS') {
                    codes.push(27);
                    currentMode = 'FIGS';
                }
                codes.push(FIGS_REV[char]);
            }
        }
        return codes;
    }

    function decodeITA2(codes) {
        let out = '';
        let mode = 'LTRS';

        for (let i = 0; i < codes.length; i++) {
            let code = codes[i];
            if (code === 27) { mode = 'FIGS'; continue; }
            if (code === 31) { mode = 'LTRS'; continue; }

            if (mode === 'LTRS') {
                out += (ITA2_LTRS[code] || '');
            } else {
                out += (ITA2_FIGS[code] || '');
            }
        }
        return out;
    }

    async function initAudio() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });
            
            const source = audioCtx.createMediaStreamSource(micStream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 4096;
            source.connect(analyser);

            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            document.getElementById('connection-status').textContent = 'AUDIO ACTIVE';
            document.getElementById('connection-status').classList.add('active');
            logInfo(`[SYS] Audio Active. Station ${operatorCallsign} Engaged.`);
            
            startReceiverLoop();
        } catch (err) {
            logInfo("[ERR] Audio init failed: " + err.message);
        }
    }

    function getNextClearSubfrequency() {
        let now = Date.now();
        let attempts = 0;
        while (attempts < NUM_SUBFREQS) {
            if (now - subfreqLastHeard[currentWorkingSubfreq] > 5000) {
                return currentWorkingSubfreq;
            }
            logInfo(`[LBT] Subfreq Slot ${currentWorkingSubfreq} busy. Rotating...`);
            currentWorkingSubfreq = (currentWorkingSubfreq + 1) % NUM_SUBFREQS;
            attempts++;
        }
        return currentWorkingSubfreq;
    }

    async function transmitMessage() {
        if (!audioCtx) {
            alert("Initialize audio engine first!");
            return;
        }
        let rawText = document.getElementById('tx-input').value.trim();
        if (!rawText) return;
        document.getElementById('tx-input').value = '';

        // Prepend configured callsign automatically
        let prependedText = `${operatorCallsign} ${rawText}`;

        let subfreqSlot = getNextClearSubfrequency();
        let subfreqAnchorFreq = 600 + (subfreqSlot * SUBFREQ_BANDWIDTH);

        logInfo(`[TX] Slot ${subfreqSlot} | 2X Burst | Anchor (${subfreqAnchorFreq}Hz)`);
        logTraffic("[TX] " + prependedText.toUpperCase());

        let ita2Codes = encodeITA2(prependedText);
        let singleBurstSymbols = [];

        ita2Codes.forEach(code => {
            let sym1 = ((code >> 2) & 0x07) + 1; 
            let sym2 = (code & 0x03) + 1;
            singleBurstSymbols.push(sym1, sym2);
        });

        // Dual-burst redundancy (send twice)
        let dataSymbols = [...singleBurstSymbols, ...singleBurstSymbols];

        let startTime = audioCtx.currentTime + 0.1;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';

        // --- PHASE 1: Silent PTT Lead-In (1.0s) ---
        osc.frequency.setValueAtTime(subfreqAnchorFreq, startTime);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.setValueAtTime(0, startTime + PTT_LEAD_IN_SILENCE);

        // --- PHASE 2: Subfrequency Channel Anchor Lock ---
        let subfreqStartTime = startTime + PTT_LEAD_IN_SILENCE;
        gain.gain.linearRampToValueAtTime(OVERLOAD_GAIN, subfreqStartTime + RAMP_TIME);

        // --- PHASE 3: Double-Length Continuous Phase Data Symbols ---
        let dataStartTime = subfreqStartTime + SUBFREQ_SYNC_DURATION;
        dataSymbols.forEach((toneIdx, index) => {
            let freq = subfreqAnchorFreq + (toneIdx * TONE_SPACING);
            let t = dataStartTime + (index * SYMBOL_DURATION);
            osc.frequency.linearRampToValueAtTime(freq, t);
        });

        let totalDuration = PTT_LEAD_IN_SILENCE + SUBFREQ_SYNC_DURATION + (dataSymbols.length * SYMBOL_DURATION);
        
        gain.gain.setValueAtTime(OVERLOAD_GAIN, startTime + totalDuration - RAMP_TIME);
        gain.gain.linearRampToValueAtTime(0, startTime + totalDuration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + totalDuration);

        currentWorkingSubfreq = (currentWorkingSubfreq + 1) % NUM_SUBFREQS;
    }

    function startReceiverLoop() {
        if (isListening) return;
        isListening = true;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const canvas = document.getElementById('waterfall');
        const canvasCtx = canvas.getContext('2d');

        function loop() {
            requestAnimationFrame(loop);
            analyser.getByteFrequencyData(dataArray);

            const isLight = document.body.getAttribute('data-theme') === 'light';
            canvasCtx.fillStyle = isLight ? '#f5f8f5' : '#000000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            
            let maxVal = 0;
            let detectedFreq = 0;

            for (let f = 400; f < 3000; f += 25) {
                let bin = Math.round(f / (audioCtx.sampleRate / analyser.fftSize));
                let v = dataArray[bin] || 0;
                if (v > maxVal) {
                    maxVal = v;
                    detectedFreq = f;
                }
            }

            let barWidth = canvas.width / (NUM_SUBFREQS * TONES_PER_SUBFREQ);
            for (let s = 0; s < NUM_SUBFREQS; s++) {
                let slotBase = 600 + (s * SUBFREQ_BANDWIDTH);
                for (let t = 0; t < TONES_PER_SUBFREQ; t++) {
                    let f = slotBase + (t * TONE_SPACING);
                    let bin = Math.round(f / (audioCtx.sampleRate / analyser.fftSize));
                    let val = dataArray[bin] || 0;
                    
                    if (val > 80 && t > 0) subfreqLastHeard[s] = Date.now();

                    let x = (s * TONES_PER_SUBFREQ + t) * barWidth;
                    canvasCtx.fillStyle = val > 120 ? (isLight ? '#007a33' : '#00ff66') : (isLight ? '#c0d0c0' : '#113311');
                    canvasCtx.fillRect(x, canvas.height - (val / 255) * canvas.height, barWidth - 1, (val / 255) * canvas.height);
                }
            }

            if (!isReceiving) {
                if (maxVal > SQUELCH_ENERGY_LIMIT) {
                    isReceiving = true;
                    symbolBuffer = [];
                    silenceFrames = 0;
                    logInfo(`[RX] Squelch Open @ ~${detectedFreq} Hz`);
                }
            } else {
                if (maxVal > SQUELCH_ENERGY_LIMIT) {
                    silenceFrames = 0;
                    symbolBuffer.push(detectedFreq);
                } else {
                    silenceFrames++;
                    if (silenceFrames > SILENCE_THRESHOLD_FRAMES) {
                        isReceiving = false;
                        logInfo("[RX] Squelch Closed.");
                        processPacketBuffer(symbolBuffer);
                        symbolBuffer = [];
                    }
                }
            }
        }
        loop();
    }

    function processPacketBuffer(rawFreqs) {
        if (rawFreqs.length < 3) {
            logInfo("[ERR] Burst too short to decode.");
            return;
        }

        logInfo(`[RX] Processing burst of ${rawFreqs.length} frames...`);

        let subfreqAnchor = rawFreqs[0];
        logInfo(`[RX] Subfreq Anchor Locked: ${subfreqAnchor} Hz. Decoding data...`);

        let dataTones = [];
        for (let i = 1; i < rawFreqs.length; i++) {
            let toneOffset = Math.round((rawFreqs[i] - subfreqAnchor) / TONE_SPACING);
            if (toneOffset >= 1 && toneOffset <= 8) {
                dataTones.push(toneOffset - 1); 
            }
        }

        let ita2Codes = [];
        for (let i = 0; i < dataTones.length - 1; i += 2) {
            let s1 = dataTones[i];
            let s2 = dataTones[i+1];
            let code = (s1 << 2) | (s2 & 0x03);
            ita2Codes.push(code);
        }

        let decodedMessage = decodeITA2(ita2Codes);
        logTraffic("[RX] " + decodedMessage);
    }
</script>
</html>
