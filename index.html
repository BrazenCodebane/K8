<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8-1 Kate - Tactical MFSK Terminal</title>
    <style>
        :root {
            --bg-color: #0b0f12;
            --panel-bg: #13181d;
            --accent-green: #00ff66;
            --accent-dim: #00441a;
            --text-main: #c0d0c0;
            --border-color: #1f2e22;
            --warning-amber: #ffaa00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel-bg); border-bottom: 2px solid var(--border-color); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; color: var(--accent-green); letter-spacing: 2px; text-transform: uppercase; }
        .status-badge { font-size: 0.8rem; padding: 2px 8px; border: 1px solid var(--border-color); background: #000; }
        .active { color: var(--accent-green); border-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-dim); }
        .main-container { display: grid; grid-template-columns: 1fr 340px; flex: 1; gap: 8px; padding: 8px; overflow: hidden; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 8px; border-radius: 4px; overflow: hidden; }
        .panel-title { font-size: 0.85rem; font-weight: bold; color: var(--warning-amber); margin-bottom: 6px; text-transform: uppercase; border-bottom: 1px dashed var(--border-color); padding-bottom: 4px; flex-shrink: 0; }
        
        /* Main Traffic Log (Left Column) */
        #traffic-log { 
            flex: 1; 
            background: #050708; 
            border: 1px solid var(--border-color); 
            padding: 8px; 
            overflow-y: auto; 
            font-size: 0.85rem; 
            line-height: 1.3; 
            white-space: pre-wrap; 
            word-break: break-all; 
            margin-bottom: 8px;
        }

        /* Sub-Frame Info Log (Right Column) - Strictly limited height */
        #info-log { 
            height: 120px; 
            max-height: 120px; 
            flex: none; 
            background: #050708; 
            border: 1px solid var(--border-color); 
            padding: 6px; 
            overflow-y: auto; 
            font-size: 0.75rem; 
            line-height: 1.2; 
            white-space: pre-wrap; 
            word-break: break-all; 
            margin-top: 4px;
            color: #88aa88;
        }

        .input-row { display: flex; gap: 8px; flex-shrink: 0; }
        input[type="text"] { flex: 1; background: #050708; border: 1px solid var(--border-color); color: var(--accent-green); padding: 8px; font-size: 0.9rem; }
        button { background: #1a261c; border: 1px solid var(--accent-green); color: var(--accent-green); padding: 8px 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        button:active { background: var(--accent-green); color: #000; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; flex-shrink: 0; }
        .metric-box { background: #050708; border: 1px solid var(--border-color); padding: 6px; text-align: center; }
        .metric-value { font-size: 1rem; color: var(--accent-green); font-weight: bold; }
        .metric-label { font-size: 0.7rem; color: #668866; }
        #waterfall { width: 100%; height: 100px; background: #000; border: 1px solid var(--border-color); margin-top: 4px; flex-shrink: 0; }
    </style>
</head>
<body>

<header>
    <h1>K8-1 Kate // Tactical MFSK Terminal</h1>
    <div id="connection-status" class="status-badge">AUDIO OFFLINE</div>
</header>

<div class="main-container">
    <!-- Left Column: Message Traffic Log & Input -->
    <div class="panel">
        <div class="panel-title">Tactical Message Traffic</div>
        <div id="traffic-log">[SYS] Terminal ready. Send or receive messages below.</div>
        <div class="input-row">
            <input type="text" id="tx-input" placeholder="Enter tactical message..." autocomplete="off">
            <button onclick="transmitMessage()">Transmit</button>
        </div>
    </div>

    <!-- Right Column: Telemetry, Spectrum, and Sub-Frame Info Log -->
    <div class="panel">
        <div class="panel-title">Link Telemetry</div>
        <div class="controls-grid">
            <div class="metric-box">
                <div id="m-baud" class="metric-value">6.6</div>
                <div class="metric-label">Baud Rate</div>
            </div>
            <div class="metric-box">
                <div id="m-mode" class="metric-value">H(7,4)</div>
                <div class="metric-label">FEC Mode</div>
            </div>
        </div>
        <button onclick="initAudio()" style="width: 100%; margin-bottom: 4px; flex-shrink: 0;">Init Audio Engine</button>
        <div class="panel-title" style="margin-top: 2px;">Spectrum Monitor</div>
        <canvas id="waterfall"></canvas>

        <!-- Sub-Frame Info Log with strict height limit -->
        <div class="panel-title" style="margin-top: 6px;">System Info & Squelch</div>
        <div id="info-log">[SYS] Standby for link activity...</div>
    </div>
</div>

<script>
    const BASE_FREQ = 400;
    const CHANNEL_WIDTH = 300;
    const NUM_CHANNELS = 8;
    const SYMBOL_DURATION = 0.15;
    const RAMP_TIME = 0.015;

    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let isListening = false;

    let isReceiving = false;
    let symbolBuffer = [];
    let silenceFrames = 0;
    const SILENCE_THRESHOLD_FRAMES = 15;
    const SQUELCH_ENERGY_LIMIT = 110;

    function logTraffic(txt) {
        const log = document.getElementById('traffic-log');
        log.textContent += "\n" + txt;
        log.scrollTop = log.scrollHeight;
    }

    function logInfo(txt) {
        const log = document.getElementById('info-log');
        log.textContent += "\n" + txt;
        log.scrollTop = log.scrollHeight;
    }

    function encodeHamming74(nibble) {
        const d3 = (nibble >> 3) & 1;
        const d2 = (nibble >> 2) & 1;
        const d1 = (nibble >> 1) & 1;
        const d0 = nibble & 1;

        const p2 = d3 ^ d2 ^ d1;
        const p1 = d3 ^ d2 ^ d0;
        const p0 = d3 ^ d1 ^ d0;

        return (d3 << 6) | (d2 << 5) | (d1 << 4) | (d0 << 3) | (p2 << 2) | (p1 << 1) | p0;
    }

    function decodeHamming74(received) {
        const d3 = (received >> 6) & 1;
        const d2 = (received >> 5) & 1;
        const d1 = (received >> 4) & 1;
        const d0 = (received >> 3) & 1;
        const p2 = (received >> 2) & 1;
        const p1 = (received >> 1) & 1;
        const p0 = received & 1;

        const s2 = p2 ^ d3 ^ d2 ^ d1;
        const s1 = p1 ^ d3 ^ d2 ^ d0;
        const s0 = p0 ^ d3 ^ d1 ^ d0;

        let syndrome = (s2 << 2) | (s1 << 1) | s0;
        let corrected = received;

        if (syndrome !== 0) {
            const errorTable = { 7: 6, 3: 5, 5: 4, 6: 3, 4: 2, 2: 1, 1: 0 };
            const bitPos = errorTable[syndrome];
            if (bitPos !== undefined) {
                corrected ^= (1 << bitPos);
            }
        }

        return ((corrected >> 6) & 1) << 3 | 
               ((corrected >> 5) & 1) << 2 | 
               ((corrected >> 4) & 1) << 1 | 
               ((corrected >> 3) & 1);
    }

    async function initAudio() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });
            
            const source = audioCtx.createMediaStreamSource(micStream);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);

            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            document.getElementById('connection-status').textContent = 'AUDIO ACTIVE';
            document.getElementById('connection-status').classList.add('active');
            logInfo("[SYS] Audio active. Squelch engaged.");
            
            startReceiverLoop();
        } catch (err) {
            logInfo("[ERR] Audio init failed: " + err.message);
        }
    }

    async function transmitMessage() {
        if (!audioCtx) {
            alert("Initialize audio engine first!");
            return;
        }
        const text = document.getElementById('tx-input').value;
        if (!text) return;
        document.getElementById('tx-input').value = '';
        
        logTraffic("[TX] " + text);

        let symbols = [];
        for (let i = 0; i < text.length; i++) {
            let byte = text.charCodeAt(i);
            let highNibble = (byte >> 4) & 0x0F;
            let lowNibble = byte & 0x0F;

            [highNibble, lowNibble].forEach(nibble => {
                let codeword = encodeHamming74(nibble);
                symbols.push((codeword >> 4) & 0x07);
                symbols.push((codeword >> 1) & 0x07);
                symbols.push(codeword & 0x01);
            });
        }

        let startTime = audioCtx.currentTime + 0.1;
        symbols.forEach((sym, index) => {
            let freq = BASE_FREQ + (sym * CHANNEL_WIDTH) + (CHANNEL_WIDTH / 2);
            let t = startTime + (index * SYMBOL_DURATION);

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);

            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.7, t + RAMP_TIME);
            gain.gain.setValueAtTime(0.7, t + SYMBOL_DURATION - RAMP_TIME);
            gain.gain.linearRampToValueAtTime(0, t + SYMBOL_DURATION);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(t);
            osc.stop(t + SYMBOL_DURATION);
        });
    }

    function startReceiverLoop() {
        if (isListening) return;
        isListening = true;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const canvas = document.getElementById('waterfall');
        const canvasCtx = canvas.getContext('2d');

        function loop() {
            requestAnimationFrame(loop);
            analyser.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = '#000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            let barWidth = canvas.width / NUM_CHANNELS;
            
            let maxBinVal = 0;
            let dominantChannel = -1;

            for (let i = 0; i < NUM_CHANNELS; i++) {
                let targetFreq = BASE_FREQ + (i * CHANNEL_WIDTH) + (CHANNEL_WIDTH / 2);
                let binIndex = Math.round(targetFreq / (audioCtx.sampleRate / analyser.fftSize));
                let val = dataArray[binIndex] || 0;

                if (val > maxBinVal) {
                    maxBinVal = val;
                    dominantChannel = i;
                }
                
                canvasCtx.fillStyle = val > 120 ? '#00ff66' : '#113311';
                canvasCtx.fillRect(i * barWidth, canvas.height - (val / 255) * canvas.height, barWidth - 2, (val / 255) * canvas.height);
            }

            if (!isReceiving) {
                if (maxBinVal > SQUELCH_ENERGY_LIMIT) {
                    isReceiving = true;
                    symbolBuffer = [];
                    silenceFrames = 0;
                    logInfo("[RX] Squelch Open (CH " + dominantChannel + ")");
                }
            } else {
                if (maxBinVal > SQUELCH_ENERGY_LIMIT) {
                    silenceFrames = 0;
                    symbolBuffer.push(dominantChannel);
                } else {
                    silenceFrames++;
                    if (silenceFrames > SILENCE_THRESHOLD_FRAMES) {
                        isReceiving = false;
                        logInfo("[RX] Squelch Closed.");
                        processPacketBuffer(symbolBuffer);
                        symbolBuffer = [];
                    }
                }
            }
        }
        loop();
    }

    function processPacketBuffer(symbols) {
        if (symbols.length < 6) {
            logInfo("[ERR] Packet too short (" + symbols.length + " sym).");
            return;
        }

        logInfo("[RX] Parsing " + symbols.length + " symbols...");
        let decodedBytes = [];

        for (let i = 0; i <= symbols.length - 6; i += 6) {
            let h1 = symbols[i];
            let h2 = symbols[i+1];
            let h3 = symbols[i+2];
            let highCodeword = (h1 << 4) | (h2 << 1) | (h3 & 0x01);
            let highNibble = decodeHamming74(highCodeword);

            let l1 = symbols[i+3];
            let l2 = symbols[i+4];
            let l3 = symbols[i+5];
            let lowCodeword = (l1 << 4) | (l2 << 1) | (l3 & 0x01);
            let lowNibble = decodeHamming74(lowCodeword);

            let asciiByte = (highNibble << 4) | lowNibble;
            decodedBytes.push(asciiByte);
        }

        let decodedMessage = String.fromCharCode.apply(null, decodedBytes);
        logTraffic("[RX] " + decodedMessage);
    }
</script>
</html>
