workflows:
  k8-android-workflow:
    name: K8-1 Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies & Capacitor CLI
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init K8-1 com.k81.kate --web-dir www
      - name: Prepare www assets
        script: |
          mkdir -p www
          cp index.html www/index.html
      - name: Initialize Android Platform & Sync
        script: |
          npx cap add android
          npx cap sync android
      - name: Lock to Landscape Orientation
        script: |
          python3 -c '
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          for act in app.findall("activity"):
              if act.get("{http://schemas.android.com/apk/res/android}name") == ".MainActivity":
                  act.set("{http://schemas.android.com/apk/res/android}screenOrientation", "landscape")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          '
      - name: Fix Kotlin Stdlib Duplicate Classes
        script: |
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Debug APK via Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
