workflows:
  k8-android-workflow:
    name: K8-1 Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies & Capacitor CLI
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init K8-1 com.k81.kate --web-dir www
      - name: Prepare www assets & Capacitor Config
        script: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"appId": "com.k81.kate", "appName": "K8-1 Kate", "webDir": "www"}' > capacitor.config.json
      - name: Initialize Android Platform & Sync
        script: |
          npx cap add android
          npx cap sync android
      - name: Inject Audio Permissions into AndroidManifest
        script: |
          python3 -c '
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          perm_name = "{http://schemas.android.com/apk/res/android}name"
          
          perms_to_add = ["android.permission.RECORD_AUDIO", "android.permission.MODIFY_AUDIO_SETTINGS"]
          for p in perms_to_add:
              if root.find(f"uses-permission[@{perm_name}=\"{p}\"]") is None:
                  perm = ET.Element("{http://schemas.android.com/apk/res/android}uses-permission", {perm_name: p})
                  root.insert(0, perm)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          '
      - name: Lock to Landscape Orientation
        script: |
          python3 -c '
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          for act in app.findall("activity"):
              if act.get("{http://schemas.android.com/apk/res/android}name") == ".MainActivity":
                  act.set("{http://schemas.android.com/apk/res/android}screenOrientation", "landscape")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          '
      - name: Force Unified Kotlin Version
        script: |
          python3 -c '
          build_gradle = "android/app/build.gradle"
          with open(build_gradle, "r") as f:
              content = f.read()
          
          resolution_block = """
          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      details.useVersion "1.8.22"
                  }
              }
          }
          """
          
          if "resolutionStrategy" not in content:
              content += resolution_block
              with open(build_gradle, "w") as f:
                  f.write(content)
          '
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Debug APK via Gradle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
